name: Validar build 2T
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npx playwright install chromium
      - name: Browser smoke tests
        run: |
          python3 -m http.server 8123 --bind 127.0.0.1 --directory dist > /tmp/2t-games-server.log 2>&1 &
          sleep 2
          PW_CHANNEL=chromium npx playwright test frontend/tests/games.spec.ts
