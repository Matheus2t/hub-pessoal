name: Validar build 2T
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Audit existing Learn catalogs
        run: npm run learn:audit
      - name: Validate planned Learn curricula and pilot contracts
        run: npm run learn:validate-pedagogy
      - name: Validate Learn diagnostic banks and feedback rubric
        run: npm run learn:validate-diagnostics
      - name: Audit repeated Learn assessments and generic writing feedback
        run: npm run learn:quality-audit
      - name: Check legacy Learn asset traceability
        run: npm run learn:coverage
      - name: Verify contextual reading guides and diagnostic isolation
        run: npm run learn:validate-reading
      - name: Verify curated pilot assets and evidence limits
        run: npm run learn:validate-curation
      - name: Validate task-specific writing and transfer rubrics
        run: npm run learn:validate-task-rubrics
      - run: npm run typecheck
      - run: npm run build
      - run: npx playwright install chromium
      - name: Browser smoke tests
        run: |
          python3 -m http.server 8123 --bind 127.0.0.1 --directory dist > /tmp/2t-games-server.log 2>&1 &
          sleep 2
          PW_CHANNEL=chromium npx playwright test frontend/tests/games.spec.ts
