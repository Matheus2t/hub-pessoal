name: 2T Call frontend validation

on:
  pull_request:
    paths:
      - 'frontend/src/call/**'
      - 'frontend/styles/_call.scss'
      - 'frontend/src/components/app-shell.ts'
      - 'backend/app/call_*.py'
      - 'backend/tests/test_call_*.py'
      - '.github/workflows/call-frontend-validation.yml'
  push:
    branches:
      - 'codex/2t-call-layout-polish'
      - 'codex/2t-call-v4-ux'
    paths:
      - 'frontend/src/call/**'
      - 'frontend/styles/_call.scss'
      - 'frontend/src/components/app-shell.ts'
      - 'backend/app/call_*.py'
      - 'backend/tests/test_call_*.py'
      - '.github/workflows/call-frontend-validation.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci --ignore-scripts
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: python -m pip install -r deploy/call/requirements.txt pytest==8.3.4
      - run: python -m pytest -q backend/tests/test_call_signaling.py backend/tests/test_call_channel.py backend/tests/test_call_voice.py backend/tests/test_call_media.py

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'npm'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts
      - run: python -m pip install -r deploy/call/requirements.txt pytest==8.3.4 cryptography
      - run: npm run build
      - run: google-chrome --version # preinstalled browser on Ubuntu Actions runner
      - run: python -m backend.tests.call_tls_harness /tmp/twot-call-v4-cert
      - name: Full V4 local WSS + WebRTC browser regression
        env:
          CALL_CHANNEL_TEST_PYTHON: python
          CALL_CHANNEL_TEST_TLS: /tmp/twot-call-v4-cert
          PW_CHANNEL: chrome
        run: npx playwright test frontend/tests/call-channel.spec.ts --reporter=line

  private-rooms:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'npm'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts
      - run: python -m pip install -r deploy/call/requirements.txt pytest==8.3.4 cryptography
      - run: npm run build
      - name: Real local WebSocket + WebRTC private-room regression
        env:
          CALL_ADMIN_KEY: test-only-owner-credential-not-for-production
          CALL_TEST_ADMIN_KEY: test-only-owner-credential-not-for-production
          CALL_ALLOWED_ORIGINS: http://127.0.0.1:8001
          CALL_SERVE_FRONTEND: 'true'
          CALL_TURN_PROVIDER: none
          CALL_STUN_URLS: ''
          CALL_TEST_URL: http://127.0.0.1:8001
          PW_CHANNEL: chrome
        run: |
          set -euo pipefail
          server=''
          trap 'if [ -n "$server" ]; then kill "$server" 2>/dev/null || true; fi' EXIT
          # Private room creation has a strict shared-edge budget of five per
          # minute. Give each independent test file a fresh local test server,
          # rather than weakening the production abuse protection.
          for suite in frontend/tests/call.spec.ts frontend/tests/call-voice.spec.ts frontend/tests/call-media.spec.ts; do
            python -m uvicorn backend.app.call_signaling:app --host 127.0.0.1 --port 8001 --no-proxy-headers > /tmp/2t-v4-uvicorn.log 2>&1 &
            server=$!
            ready=false
            for i in $(seq 1 30); do
              if curl -fsS http://127.0.0.1:8001/call/health >/dev/null 2>&1; then ready=true; break; fi
              sleep 1
            done
            if [ "$ready" != true ]; then cat /tmp/2t-v4-uvicorn.log; exit 1; fi
            npx playwright test "$suite" --reporter=line --retries=1
            kill "$server" 2>/dev/null || true
            wait "$server" 2>/dev/null || true
            server=''
          done
