name: 2T Call frontend validation

on:
  pull_request:
    paths:
      - 'frontend/src/call/**'
      - 'frontend/styles/_call.scss'
      - '.github/workflows/call-frontend-validation.yml'
  push:
    branches:
      - 'codex/2t-call-layout-polish'
    paths:
      - 'frontend/src/call/**'
      - 'frontend/styles/_call.scss'
      - '.github/workflows/call-frontend-validation.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci --ignore-scripts
      - run: npm run build
