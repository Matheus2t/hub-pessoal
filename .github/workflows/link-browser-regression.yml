name: Desencurtador - comparação da regressão Playwright
on:
  pull_request:
    paths:
      - '.github/workflows/link-browser-regression.yml'
      - 'frontend/**'
      - 'backend/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: link-browser-regression-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  compare-browser:
    name: Browser completo (${{ matrix.revision }})
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        revision: [baseline, candidate]
    env:
      PYTHONPATH: backend
      VERCEL: '1'
      PUBLIC_HISTORY_ENABLED: 'false'
      DATABASE_URL: ''
      PW_CHANNEL: chromium
      BASE_URL: http://127.0.0.1:8123
    steps:
      - name: Checkout a mesma revisão para build e testes
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.revision == 'baseline' && 'main' || github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-test.txt
      - name: Install dependencies
        run: |
          npm ci
          python -m pip install -r backend/requirements-test.txt
          npx playwright install --with-deps chromium
      - name: Typecheck and production-style build
        run: npm run build
      - name: Start FastAPI with built frontend (loopback only)
        run: |
          python -m uvicorn app.main:app --app-dir backend --host 127.0.0.1 --port 8123 > /tmp/link-browser-api.log 2>&1 &
          for i in {1..50}; do
            if curl --silent --fail http://127.0.0.1:8123/api/health > /dev/null; then exit 0; fi
            sleep 0.2
          done
          cat /tmp/link-browser-api.log
          exit 1
      - name: Run complete Playwright suite, preserve failures for comparison
        id: browser
        shell: bash
        run: |
          set +e
          npx playwright test --reporter=json > browser-results.json 2>browser-stderr.log
          status=$?
          set -e
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const output = fs.existsSync('browser-results.json') ? fs.readFileSync('browser-results.json','utf8') : '';
          let report;
          try { report = JSON.parse(output); } catch {
            fs.writeFileSync('browser-summary.txt','Browser report unavailable; inspect stderr and API logs.\n');
            process.exit(0);
          }
          const failed = [];
          function walk(suites, titles=[]) {
            for (const suite of suites || []) {
              const next = [...titles, suite.title || ''];
              for (const spec of suite.specs || []) {
                for (const test of spec.tests || []) {
                  if (test.status === 'unexpected' || test.results?.some(r => ['failed','timedOut','interrupted'].includes(r.status))) {
                    failed.push({file:suite.file || '', title:[...next,spec.title].filter(Boolean).join(' > '), errors:(test.results || []).flatMap(r => r.errors || []).map(e => String(e.message || e.value || '').slice(0,300))});
                  }
                }
              }
              walk(suite.suites,next);
            }
          }
          walk(report.suites);
          const summary = {revision:process.env.GITHUB_REF_NAME,stats:report.stats,failed};
          fs.writeFileSync('browser-summary.json',JSON.stringify(summary,null,2));
          fs.writeFileSync('browser-summary.txt',`Total failures: ${failed.length}\n`+failed.map(f=>`${f.file} :: ${f.title}\n${f.errors.join('\n')}\n`).join('\n'));
          NODE
          echo "### ${{ matrix.revision }}: Playwright exit code $status" >> "$GITHUB_STEP_SUMMARY"
          if [ -f browser-summary.txt ]; then head -n 60 browser-summary.txt >> "$GITHUB_STEP_SUMMARY"; fi
          exit 0
      - name: Archive regression evidence (no secrets)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: link-browser-${{ matrix.revision }}
          path: |
            browser-summary.json
            browser-summary.txt
            browser-stderr.log
            /tmp/link-browser-api.log
          if-no-files-found: ignore
      - name: Report test status
        if: steps.browser.outputs.exit_code != '0'
        run: |
          echo "Full Playwright regression has failures on ${{ matrix.revision }}. Compare artifacts against baseline." >&2
          exit 1
