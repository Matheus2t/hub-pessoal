name: Validar teclado fonético do Learn
on:
  pull_request:
    paths:
      - 'frontend/src/learn/**'
      - 'frontend/tests/learn-phonetic.spec.ts'
      - 'frontend/styles/_learn.scss'
      - 'frontend/styles/_learn-workspace-v20.scss'
      - 'frontend/tests/learn-workspace-v20.spec.ts'
      - 'frontend/tests/learn-v19-integration.spec.ts'
      - 'frontend/tests/learn-v18-editorial.spec.ts'
      - 'frontend/tests/learn-progress-v17.spec.ts'
      - 'docs/learn-revisao-final-v18.md'
      - 'docs/learn-revisao-integrada-v18.json'
      - 'scripts/learn-audio-v19/**'
      - 'package.json'
      - '.github/workflows/learn-phonetic-validation.yml'
permissions:
  contents: read
jobs:
  russian-phonetic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: Check private V19 preview gates
        run: node --test scripts/learn-audio-v19/local-study-preview.test.mjs
      - run: npx playwright install chromium
      - name: Run complete Learn regression and phonetic editor browser tests
        run: |
          python3 -m http.server 8123 --bind 127.0.0.1 --directory dist > /tmp/2t-learn-phonetic.log 2>&1 &
          sleep 2
          PW_CHANNEL=chromium npx playwright test frontend/tests/learn-v19-integration.spec.ts --grep 'V19 preview stays within screen'
          PW_CHANNEL=chromium npx playwright test frontend/tests/learn-*.spec.ts
