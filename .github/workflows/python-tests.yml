name: Backend Python tests

on:
  pull_request:
    paths:
      - 'backend/**'
      - 'api/**'
      - 'scripts/**/*.py'
      - 'requirements.txt'
      - 'pytest.ini'
      - 'pyproject.toml'
      - '.github/workflows/python-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: python-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: pytest (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      PYTHONPATH: backend
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-test.txt
      - name: Install backend and test dependencies
        run: python -m pip install -r backend/requirements-test.txt
      - name: Run Call regressions with per-test timeout
        run: >-
          python -m pytest -vv -rs backend/tests/test_call_signaling.py backend/tests/test_call_channel.py
          --timeout=120 --timeout-method=thread --junitxml=pytest-call-results.xml
      - name: Run full Python suite with per-test timeout
        run: >-
          python -m pytest -vv -rs --timeout=120 --timeout-method=thread
          --junitxml=pytest-results.xml
      - name: Upload pytest reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-reports-${{ matrix.os }}
          path: |
            pytest-call-results.xml
            pytest-results.xml
          if-no-files-found: ignore
