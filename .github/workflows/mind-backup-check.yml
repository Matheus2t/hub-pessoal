name: Verify Mente backup code without production access
on:
  pull_request:
    paths:
      - 'scripts/mind-production-backup.mjs'
      - 'scripts/mind-production-backup.test.mjs'
      - 'scripts/supabase-prod-ca-2021.crt'
      - '.github/workflows/mind-production-db-backup.yml'
      - '.github/workflows/mind-backup-check.yml'
      - 'tests/mind-codespaces/verify-backup-fixture.mjs'
permissions:
  contents: read
jobs:
  backup-code:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: backup-fixture-only
        ports:
          - 54322:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - run: node --test scripts/mind-production-backup.test.mjs
      - run: node tests/mind-codespaces/verify-backup-fixture.mjs
