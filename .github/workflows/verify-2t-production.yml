name: Verificar 2T Learn em produção
on:
  pull_request:
    paths:
      - '.github/workflows/verify-2t-production.yml'
      - 'scripts/verify-2t-production.mjs'
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  production-health:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate public site and published Learn bundle (read only)
        run: node scripts/verify-2t-production.mjs
