name: Calculator copy regression
on:
  pull_request:
    paths:
      - 'frontend/src/components/compound-calculator.ts'
      - 'frontend/src/components/finance-calculator.ts'
      - 'frontend/tests/calculator-notices.spec.ts'
      - 'frontend/src/components/fixed-income-page.ts'
      - 'frontend/styles/_workspace.scss'
      - 'frontend/tests/fixed-income-layout.spec.ts'
      - 'frontend/tests/platform-v2-tools.spec.ts'
      - 'frontend/tests/fixed-income.spec.ts'
      - '.github/workflows/calculator-copy-regression.yml'
permissions:
  contents: read
jobs:
  copy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install frontend dependencies
        run: npm ci
      - name: Validate TypeScript and build
        run: npm run build
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Serve built site
        run: python3 -m http.server 8123 --directory dist >/tmp/2t-site.log 2>&1 &
      - name: Test all four calculator pages
        env:
          PW_CHANNEL: chromium
          BASE_URL: http://127.0.0.1:8123
        run: npx playwright test frontend/tests/calculator-notices.spec.ts
      - name: Test Renda Fixa layout and calculations
        env:
          PW_CHANNEL: chromium
          BASE_URL: http://127.0.0.1:8123
        run: |
          npx playwright test frontend/tests/fixed-income-layout.spec.ts frontend/tests/fixed-income.spec.ts frontend/tests/layout-v2-fixed.spec.ts
          npx playwright test frontend/tests/platform-v2-tools.spec.ts --grep 'fixed scenarios can be saved'
