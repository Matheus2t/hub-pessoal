name: 2T extended calculators validation
on:
  pull_request:
    paths:
      - 'frontend/src/extended-finance.ts'
      - 'frontend/src/components/extended-finance-calculator.ts'
      - 'frontend/src/catalog.ts'
      - 'frontend/src/components/app-shell.ts'
      - 'frontend/styles/_extended-finance.scss'
      - 'frontend/styles/main.scss'
      - 'frontend/tests/extended-finance.spec.ts'
      - '.github/workflows/extended-finance-validation.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install dependencies
        run: npm ci
      - name: Typecheck and build
        run: npm run build
      - name: Install Chromium
        run: npx playwright install chromium
      - name: Serve build
        run: python3 -m http.server 8123 --directory dist >/tmp/2t-finance.log 2>&1 &
      - name: Four extended calculator journeys
        env:
          PW_CHANNEL: chromium
          BASE_URL: http://127.0.0.1:8123
        run: npx playwright test frontend/tests/extended-finance.spec.ts
