name: 2T Call V4 production read-only verification

on:
  push:
    branches:
      - codex/2t-call-v4-live-smoke

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Confirm backend health and protected D1 room without changing data
        run: |
          python3 - <<'PY'
          import json, time
          from urllib.request import Request, urlopen
          from urllib.error import URLError, HTTPError
          base='https://twot-call.onrender.com'
          origin='https://matheus2t.com.br'
          def read(path):
              for attempt in range(4):
                  try:
                      req=Request(base+path,headers={'Origin':origin,'Cache-Control':'no-store'})
                      with urlopen(req,timeout=75) as response:
                          if response.status!=200: raise RuntimeError('Non-200 status')
                          if response.headers.get('Access-Control-Allow-Origin')!=origin: raise RuntimeError('Missing production CORS origin')
                          return json.load(response)
                  except (URLError,HTTPError,TimeoutError) as e:
                      if attempt==3: raise RuntimeError('Backend route unreachable') from e
                      time.sleep(5)
          health=read('/call/health')
          if health.get('status')!='ok' or health.get('mode')!='single-process':
              raise RuntimeError('Unexpected health state')
          print('Render health and CORS: OK')
          lobby=read('/call/lobby')
          if lobby.get('type')!='channel' or not lobby.get('name') or lobby.get('requiresPassword') is not True or lobby.get('setupRequired'):
              raise RuntimeError('Permanent D1 room unavailable or not password protected')
          print('Existing permanent room and password protection: OK')
          print('Participants currently online in permanent room:',lobby.get('online'))
          PY
      - name: Verify production origin WebSocket handshake
        run: |
          python3 -m pip install --disable-pip-version-check --quiet websockets==15.0.1
          python3 - <<'PY'
          import asyncio
          import websockets
          async def check():
              async with websockets.connect('wss://twot-call.onrender.com/call/ws',origin='https://matheus2t.com.br',open_timeout=30,close_timeout=5):
                  print('Authenticated production origin WebSocket handshake: OK')
          asyncio.run(check())
          PY
