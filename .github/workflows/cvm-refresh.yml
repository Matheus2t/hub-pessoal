name: Prepare weekly CVM snapshot
on:
  workflow_dispatch:
  schedule:
    - cron: '17 8 * * 1'
permissions:
  contents: read
jobs:
  prepare:
    # Public repositories use GitHub-hosted Actions without minute charges.
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python scripts/cvm_financials.py --refresh
      - name: Report coverage for review
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          manifest = json.loads(Path('frontend/public/financials/manifest.json').read_text(encoding='utf8'))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf8') as report:
              report.write('# CVM coverage check\n\n')
              report.write('Snapshot: ' + manifest['snapshot'] + '\n\n')
              for symbol, coverage in manifest['coverage'].items():
                  report.write(f"- {symbol}: {coverage['periods']} periods\n")
              report.write('\nPublication requires local review, tests and commit. No artifact storage is used.\n')
          PY
