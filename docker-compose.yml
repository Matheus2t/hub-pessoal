services:
  db:
    image: mysql:8.4
    container_name: hub-pessoal-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: hub_pessoal
      MYSQL_USER: hub
      MYSQL_PASSWORD: hub
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  mysql_data:
